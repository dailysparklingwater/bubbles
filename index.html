<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Bubble Board: a personal ranking of 39 sparkling waters.">
  <meta name="color-scheme" content="dark">
  <title>The Bubble Board - 39 Sparkling Waters Ranked</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-950: #070b16;
      --navy-900: #0a0f1e;
      --navy-800: #111a31;
      --ice: #f3f7ff;
      --silver: #c8d8e8;
      --silver-soft: rgba(200, 216, 232, 0.66);
      --silver-faint: rgba(200, 216, 232, 0.10);
      --gold: #e8c547;
      --gold-light: #f3db78;
      --danger: #ff8d8d;
      --display: "Bebas Neue", Impact, sans-serif;
      --sans: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.40);
      --content: 1180px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: radial-gradient(circle at 12% 10%, rgba(71, 121, 191, 0.10), transparent 28rem), var(--navy-900);
      color: var(--ice);
      font-family: var(--sans);
      line-height: 1.5;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");
    }
    img { display: block; max-width: 100%; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .site-nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 18px clamp(18px, 4vw, 46px);
      background: linear-gradient(to bottom, rgba(7, 11, 22, 0.94), rgba(7, 11, 22, 0));
      backdrop-filter: blur(8px);
    }
    .brand { font-family: var(--display); font-size: 1.45rem; letter-spacing: 0.16em; color: var(--gold); text-decoration: none; }
    .nav-date, .nav-count { color: var(--silver-soft); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
    .hero { position: relative; min-height: 100svh; display: grid; place-items: center; padding: 110px 24px 80px; text-align: center; isolation: isolate; }
    .hero-title { margin: 0; font-family: var(--display); font-size: clamp(5rem, 15vw, 12rem); line-height: 0.78; }
    .hero-title span { color: var(--gold); }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 11px 18px; border: 1px solid rgba(232, 197, 71, 0.38); border-radius: 999px; background: rgba(232, 197, 71, 0.08); color: var(--gold-light); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: transform 180ms ease; }
    .button-primary { background: var(--gold); color: var(--navy-950); }
    .section-shell { width: min(100% - 36px, var(--content)); margin-inline: auto; }
    .featured { position: relative; padding: 100px 0; border-top: 1px solid rgba(232, 197, 71, 0.20); }
    .featured-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 50px; align-items: center; }
    .featured-name { font-family: var(--display); font-size: clamp(4rem, 9vw, 7.8rem); line-height: 0.84; margin: 0; }
    .score-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 20px; }
    .score { padding: 14px; border: 1px solid rgba(200, 216, 232, 0.10); border-radius: 14px; background: rgba(200, 216, 232, 0.035); }
    .score-label { display: block; font-size: 0.62rem; text-transform: uppercase; color: var(--silver-soft); }
    .score-value { display: block; font-family: var(--display); font-size: 2.2rem; }
    .product-visual { position: relative; display: grid; place-items: center; min-height: 400px; }
    .bottle-image { position: relative; z-index: 1; width: auto; max-height: 450px; filter: drop-shadow(0 35px 45px rgba(0, 0, 0, 0.5)); }
    .bottle-fallback { text-align: center; padding: 40px; border: 1px dashed var(--silver-faint); border-radius: 20px; }
    .rankings-list { display: grid; gap: 24px; }
    .water-card { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid rgba(200, 216, 232, 0.1); border-radius: 28px; background: rgba(7, 11, 22, 0.5); overflow: hidden; }
    .card-visual { padding: 40px; border-right: 1px solid rgba(200, 216, 232, 0.1); display: grid; place-items: center; }
    .card-info { padding: 60px; display: flex; flex-direction: column; justify-content: center; }
    .card-name { font-family: var(--display); font-size: clamp(3rem, 6vw, 6rem); line-height: 0.84; margin: 0 0 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 30px; }
    .control { padding: 10px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; }
    @media (max-width: 900px) {
      .featured-grid, .water-card { grid-template-columns: 1fr; }
      .card-visual { border-right: 0; border-bottom: 1px solid rgba(200, 216, 232, 0.1); }
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a class="brand" href="#">SPARKLING</a>
    <span class="nav-date" id="todayDate"></span>
    <span class="nav-count" id="navCount">39 waters ranked</span>
  </nav>

  <header class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">The <span>Bubble</span> Board</h1>
      <p>A global ranking of the world's best sparkling waters.</p>
      <div class="hero-actions">
        <a class="button button-primary" href="#rankings">See Rankings</a>
      </div>
    </div>
  </header>

  <main>
    <section class="featured">
      <div class="section-shell featured-grid">
        <div class="featured-copy">
          <span class="kicker">Water of the Day</span>
          <h2 class="featured-name" id="featuredName"></h2>
          <p id="featuredOrigin"></p>
          <div class="score-grid" id="featuredScores"></div>
        </div>
        <div class="featured-visual" id="featuredVisual"></div>
      </div>
    </section>

    <section class="rankings-section" id="rankings">
      <div class="section-shell">
        <div class="controls">
          <input class="control" id="searchInput" type="search" placeholder="Search waters...">
          <select class="control" id="countryFilter"><option value="">All Origins</option></select>
        </div>
        <div class="rankings-list" id="rankingsList"></div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const waters = [
      { name: "Voss", nation: "Norway", code: "NO", taste: 10, sparkle: 6, aesthetics: 8.5, image: "voss.JPG" },
      { name: "Marlish", nation: "England", code: "GB-ENG", taste: 8.5, sparkle: 7, aesthetics: 8.5, image: "marlish.JPG" },
      { name: "San Pellegrino", nation: "Italy", code: "IT", taste: 9, sparkle: 7, aesthetics: 8, image: "sanpellegrino.JPG" },
      { name: "Vichy Catalan", nation: "Spain", code: "ES", taste: 7.5, sparkle: 7.5, aesthetics: 8.5, image: "vichycatalan.JPG" },
      { name: "Sarikiz", nation: "Türkiye", code: "TR", taste: 8, sparkle: 9, aesthetics: 6, image: "sarikiz.JPG" },
      { name: "Topo chico", nation: "Mexico", code: "MX", taste: 6, sparkle: 9, aesthetics: 8, image: "topochico.JPG" },
      { name: "Highland spring", nation: "Scotland", code: "GB-SCT", taste: 9, sparkle: 7.5, aesthetics: 6, image: "highlandspring.JPG" },
      { name: "Solan de Cabras", nation: "Spain", code: "ES", taste: 8, sparkle: 6.5, aesthetics: 8, image: "solandecabras.JPG" },
      { name: "Brecon Carreg", nation: "Wales", code: "GB-WLS", taste: 8, sparkle: 8, aesthetics: 6.5, image: "breconcarreg.JPG" },
      { name: "Asahi Wilkinson", nation: "Japan", code: "JP", taste: 8, sparkle: 9, aesthetics: 5, image: "asahiwilkinson.JPG" },
      { name: "Icelandic Glacial", nation: "Iceland", code: "IS", taste: 8, sparkle: 6, aesthetics: 8, image: "icelandicglacier.JPG" },
      { name: "Sarajevski Kiseljak", nation: "Bosnia and Herzegovina", code: "BA", taste: 7.5, sparkle: 7, aesthetics: 7, image: "sarajevskikiseljak.JPG" },
      { name: "Kingsdown", nation: "England", code: "GB-ENG", taste: 8, sparkle: 6.5, aesthetics: 7, image: "kingsdown.JPG" },
      { name: "M&S Scottish Sparkling", nation: "Scotland", code: "GB-SCT", taste: 8, sparkle: 7.5, aesthetics: 5, image: "msscottish.JPG" },
      { name: "Jamnica", nation: "Croatia", code: "HR", taste: 7, sparkle: 6.5, aesthetics: 7, image: "jamnica.JPG" },
      { name: "Borjomi", nation: "Georgia", code: "GE", taste: 5, sparkle: 7, aesthetics: 8, image: "borjomi.JPG" },
      { name: "Buxton", nation: "England", code: "GB-ENG", taste: 7, sparkle: 8, aesthetics: 4.5, image: "buxton.JPG" },
      { name: "Aqua Carpatica", nation: "Romania", code: "RO", taste: 7, sparkle: 6.5, aesthetics: 6, image: "aquacarpatica.JPG" },
      { name: "Liquid Death", nation: "USA", code: "US", taste: 3, sparkle: 7.5, aesthetics: 8, image: "liquiddeath.JPG" },
      { name: "San Benedetto Bolle Decise", nation: "Italy", code: "IT", taste: 6.5, sparkle: 7.5, aesthetics: 4.5, image: "sanbenedetto.JPG" },
      { name: "Deeside", nation: "Scotland", code: "GB-SCT", taste: 7, sparkle: 4.5, aesthetics: 6.5, image: "deeside.JPG" },
      { name: "Radnor", nation: "Wales", code: "GB-WLS", taste: 5, sparkle: 6, aesthetics: 7, image: "radnor.JPG" },
      { name: "The Newt in Somerset", nation: "England", code: "GB-ENG", taste: 7, sparkle: 4, aesthetics: 7, image: "thenewtinsomerset.JPG" },
      { name: "Agua Coaliment", nation: "Spain", code: "ES", taste: 7, sparkle: 8, aesthetics: 3, image: "aguacoaliment.JPG" },
      { name: "Aqua Libra", nation: "England", code: "GB-ENG", taste: 4, sparkle: 6.5, aesthetics: 7.5, image: "aqualibra.JPG" },
      { name: "Knjaz Milos", nation: "Serbia", code: "RS", taste: 5.5, sparkle: 6.5, aesthetics: 5.5, image: "knjazmilos.JPG" },
      { name: "Strathmore", nation: "Scotland", code: "GB-SCT", taste: 8, sparkle: 4.5, aesthetics: 5, image: "strathmore.JPG" },
      { name: "Flying Tiger Sparkling", nation: "Denmark", code: "DK", taste: 7, sparkle: 3.5, aesthetics: 6.5, image: "flyingtiger.JPG" },
      { name: "Pret Sparkling", nation: "England", code: "GB-ENG", taste: 6, sparkle: 7, aesthetics: 3, image: "pretsparkling.JPG" },
      { name: "Morrisons Yorkshire Vale", nation: "England", code: "GB-ENG", taste: 7, sparkle: 5, aesthetics: 3.5, image: "morrisonsyorkshirevale.JPG" },
      { name: "Smart Water", nation: "England", code: "GB-ENG", taste: 6, sparkle: 3, aesthetics: 6, image: "smartwater.JPG" },
      { name: "Ice Valley", nation: "England", code: "GB-ENG", taste: 6, sparkle: 4, aesthetics: 4, image: "icevalley.JPG" },
      { name: "One Water", nation: "England", code: "GB-ENG", taste: 6.5, sparkle: 4, aesthetics: 3, image: "one.JPG" },
      { name: "Amazon Shepley Spring", nation: "England", code: "GB-ENG", taste: 5, sparkle: 7, aesthetics: 1, image: "amazon.JPG" },
      { name: "Cano Water", nation: "England", code: "GB-ENG", taste: 2, sparkle: 4, aesthetics: 7, image: "canowater.JPG" },
      { name: "Donat", nation: "Slovenia", code: "SI", taste: 1, sparkle: 7, aesthetics: 4, image: "donat.JPG" },
      { name: "Muszynianka", nation: "Poland", code: "PL", taste: 8, sparkle: 2, aesthetics: 2, image: "muszynianka.JPG" },
      { name: "Fonter", nation: "Spain", code: "ES", taste: 2, sparkle: 3, aesthetics: 5, image: "fonter.JPG" },
      { name: "Pedras Salgadas", nation: "Portugal", code: "PT", taste: 3, sparkle: 0.5, aesthetics: 5, image: "pedrassalgadas.JPG" }
    ].map((water, index) => ({
      ...water,
      rank: index + 1,
      id: water.name.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
      total: (water.taste + water.sparkle + water.aesthetics) / 3
    }));

    const featuredWaterId = "muszynianka";

    function initialise() {
      document.getElementById("todayDate").textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
      populateFilter();
      renderFeatured();
      renderRankings(waters);
      
      document.getElementById("searchInput").addEventListener("input", applyFilters);
      document.getElementById("countryFilter").addEventListener("change", applyFilters);
    }

    function createProductVisual(water) {
      const wrapper = document.createElement("div");
      wrapper.className = "product-visual";

      const image = document.createElement("img");
      image.className = "bottle-image";
      image.alt = water.name;
      // The ?v=2 forces Chrome to re-download the image if it failed before
      image.src = "./" + water.image + "?v=2"; 

      const fallback = document.createElement("div");
      fallback.className = "bottle-fallback";
      fallback.innerHTML = `<span>${water.name}</span><br><small>Loading Image...</small>`;

      image.onload = () => { fallback.style.display = 'none'; };
      image.onerror = () => { image.style.display = 'none'; fallback.innerHTML = `<span>${water.name}</span><br><small>Image Not Found</small>`; };

      wrapper.append(fallback, image);
      return wrapper;
    }

    function renderFeatured() {
      const water = waters.find(w => w.id === featuredWaterId) || waters[0];
      document.getElementById("featuredName").textContent = water.name;
      document.getElementById("featuredOrigin").textContent = water.nation;
      document.getElementById("featuredScores").innerHTML = `
        <div class="score"><span class="score-label">Taste</span><span class="score-value">${water.taste}</span></div>
        <div class="score"><span class="score-label">Sparkle</span><span class="score-value">${water.sparkle}</span></div>
        <div class="score"><span class="score-label">Aesthetics</span><span class="score-value">${water.aesthetics}</span></div>
        <div class="score"><span class="score-label">Total</span><span class="score-value">${water.total.toFixed(1)}</span></div>
      `;
      document.getElementById("featuredVisual").replaceChildren(createProductVisual(water));
    }

    function createWaterCard(water) {
      const card = document.createElement("article");
      card.className = "water-card";
      card.innerHTML = `
        <div class="card-visual"></div>
        <div class="card-info">
          <span class="kicker">Rank #${water.rank}</span>
          <h3 class="card-name">${water.name}</h3>
          <p>${water.nation}</p>
          <div class="score-grid">
            <div class="score"><span class="score-label">Taste</span><span class="score-value">${water.taste}</span></div>
            <div class="score"><span class="score-label">Total</span><span class="score-value">${water.total.toFixed(1)}</span></div>
          </div>
        </div>
      `;
      card.querySelector(".card-visual").appendChild(createProductVisual(water));
      return card;
    }

    function renderRankings(list) {
      const container = document.getElementById("rankingsList");
      container.innerHTML = "";
      list.forEach(w => container.appendChild(createWaterCard(w)));
    }

    function populateFilter() {
      const nations = [...new Set(waters.map(w => w.nation))].sort();
      const select = document.getElementById("countryFilter");
      nations.forEach(n => {
        const opt = document.createElement("option");
        opt.value = n;
        opt.textContent = n;
        select.appendChild(opt);
      });
    }

    function applyFilters() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const n = document.getElementById("countryFilter").value;
      const filtered = waters.filter(w => {
        return (w.name.toLowerCase().includes(q)) && (!n || w.nation === n);
      });
      renderRankings(filtered);
    }

    initialise();
  </script>
</body>
</html>
